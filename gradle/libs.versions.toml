[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
kover = "0.9.11"
cryptography = "0.6.0"
bouncycastle = "1.86"
ktor = "3.6.1"
maven-publish = "0.37.0"
dokka = "2.2.0"
# npm `ws`, the WebSocket server of kcoap-transport-ktor-websocket's Node.js tests: the version
# ktor-client-core already brings for Node.js, so the yarn lock stays as it is.
npm-ws = "8.20.1"
# The oldest Android API level kcoap supports (Android 8.0). checkAndroidApi checks every jvm jar against
# its API signature (android-api-signature below, which must name the same level), and
# samples/android-consumer builds an app with it as minSdk.
android-minSdk = "26"
animal-sniffer = "1.28"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# checkAndroidApi: animal-sniffer and the API signature of Android 8.0 (API level 26, android-minSdk).
animal-sniffer = { module = "org.codehaus.mojo:animal-sniffer", version.ref = "animal-sniffer" }
android-api-signature = { module = "net.sf.androidscents.signature:android-api-level-26", version = "8.0.0_r2" }
