# Memory: a build takes about 3 GB for Gradle (Kotlin/Native compiles in it) and 2 GB for the Kotlin
# daemon, at most 8 tasks run at once, and idle daemons exit after 15 minutes.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=8
org.gradle.daemon.idletimeout=900000
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# Apple targets can only be compiled on macOS; on Linux they are skipped instead of failing the build.
kotlin.native.ignoreDisabledTargets=true

# Maven coordinates: the dev.kcoap namespace is backed by the kcoap.dev domain (docs/releasing.md).
kcoap.group=dev.kcoap
kcoap.version=0.1.0-SNAPSHOT

# Incremental compilation broke twice after merges in this multi-worktree setup; full module builds are fast enough.
kotlin.incremental=false
kotlin.incremental.multiplatform=false
# The JS and Wasm test links keep per-module caches under build/klib/cache. Three times a stale Wasm cache
# produced a test binary that Node rejects (CompileError in ConcurrencyStressTest), and the build cache then
# served it to other worktrees. Link from scratch instead.
kotlin.incremental.js.ir=false
kotlin.incremental.wasm=false
