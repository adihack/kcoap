# The size budget of the browser sample's production bundle, in bytes: every .js file webpack writes for it
# (js-consumer.js and a 272-byte chunk that only Node.js would load), as served, and gzip-compressed at level 9.
# checkBundleSize (part of check) fails when either is exceeded.
#
# Measured by WP-P1 on 2026-11-06 (Kotlin 2.4.21, ktor 3.6.1, webpack 5 as kotlin-js-store/yarn.lock pins it):
#   minified 1149569 bytes, gzip -9 316415 bytes.
# Budget: the measurement plus 5 %, rounded up to a whole KiB.
#
# To re-measure: ./gradlew publishToMavenLocal in the repository root, then
#   ./gradlew -p samples/js-consumer checkBundleSize
# prints both sizes (also in build/reports/bundle-size.txt). A change that is meant to grow the bundle raises both
# numbers here and the measurement in README.md and docs/platforms.md ("Bundle size") in the same commit.
minified=1207296
gzip=332800
