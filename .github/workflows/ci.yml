name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (JVM, Linux native, JS, Wasm) and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Every common test on the JVM, as Kotlin/Native (the runtime iOS also uses) and on Node.js as
      # JavaScript and as Wasm, with WebCrypto underneath as in browsers.
      - run: scripts/test unit
      - run: ./gradlew --console=plain koverXmlReport koverVerify -Pkcoap.tests=unit
      - name: Coverage summary
        if: always()
        run: scripts/coverage-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-reports
          path: |
            **/build/reports/tests/
            build/reports/kover/

  interop:
    name: Interop with libcoap and libedhoc (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Builds the pinned libcoap and libedhoc images, then runs every cross-test in both roles.
      - run: scripts/test interop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interop-logs
          path: |
            **/build/interop-logs/
            **/build/reports/tests/

  apple:
    name: Native tests (macOS and iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The same common tests against CryptoKit and CommonCrypto.
      - run: scripts/test apple
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: apple-reports
          path: '**/build/reports/tests/'

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --console=plain dokkaGenerate
      - uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: build/dokka/html/
