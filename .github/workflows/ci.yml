name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: JVM tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest

  apple:
    name: Native tests (macOS + iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Runs the same RFC vectors against CryptoKit + CommonCrypto.
      - run: ./gradlew macosArm64Test iosSimulatorArm64Test
